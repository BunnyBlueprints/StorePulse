services:
  - type: web
    name: storepulse-backend
    env: node
    rootDir: Backend
    buildCommand: npm install && npm run prisma:generate && npm run db:push && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
